<!DOCTYPE html>
<html class="light" lang="vi"><head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Đăng Nhập - Luxury Fashion</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#000000",
                        "background-light": "#f7f7f7",
                        "background-dark": "#191919",
                        "brand-off-white": "#FAFAFA",
                        "brand-dark-gray": "#111111",
                        "brand-light-beige": "#D5BFA3",
                        "brand-light-gray": "#CFCFCF",
                        "brand-deep-black": "#000000",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
    <style>
        .form-checkbox:checked {
            background-image: url("data:image/svg+xml,%3csvg viewBox='0 0 16 16' fill='white' xmlns='http://www.w3.org/2000/svg'%3e%3cpath d='M12.207 4.793a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0l-2-2a1 1 0 011.414-1.414L6.5 9.086l4.293-4.293a1 1 0 011.414 0z'/%3e%3c/svg%3e");
        }
    </style>
</head>
<body class="font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col bg-brand-off-white dark:bg-background-dark group/design-root overflow-x-hidden">
    <div class="flex flex-1 w-full">
        <div class="flex flex-col lg:flex-row w-full">
            <div class="hidden lg:block lg:w-1/2 relative">
                <div class="absolute inset-0 bg-center bg-no-repeat bg-cover" data-alt="A high-fashion model posing in an elegant outfit" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDsRkwoHclYd-zDt67R6RUTFK1a70eLo1LqQYce9e_oPoJWlmAGpnr1Kk7_qRAgbmPa6X4NAUts5g4nMv_X6CJtnJWehbp0PT7mB8tN7fC0fLkXZ72ka4n-tcfvyVeQIlxmF-cGUbHjkVXspiksEktzLFmSrC5YCGdgs4bOWe6LZ525iFpwgQKm9z8vtgt8HrMruRX-bNCoHOumWs9cLMiGeJj-kusQslmqYg_OJ7FmRk4L46YT03cKQOcgdZhwLi8Tl1nFJAzVYpU");'></div>
            </div>
            <div class="w-full lg:w-1/2 flex items-center justify-center p-8 lg:p-16">
                <div class="w-full max-w-md flex flex-col gap-8">
                    <div class="flex flex-col gap-3 text-center">
                        <p class="text-brand-dark-gray dark:text-white text-4xl font-black leading-tight tracking-[-0.033em]">Đăng Nhập</p>
                        <p class="text-gray-500 dark:text-gray-400 text-base font-normal leading-normal">Chào mừng trở lại</p>
                    </div>
                    <div class="flex flex-col gap-6">
                        <label class="flex flex-col w-full">
                            <p class="text-brand-dark-gray dark:text-gray-300 text-base font-medium leading-normal pb-2">Số điện thoại hoặc Email</p>
                            <input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-brand-dark-gray dark:text-white dark:bg-background-dark focus:outline-0 focus:ring-2 focus:ring-brand-light-beige border border-brand-light-gray bg-white focus:border-brand-light-beige h-14 placeholder:text-gray-400 p-[15px] text-base font-normal leading-normal" placeholder="Nhập số điện thoại hoặc email" value=""/>
                        </label>
                        <label class="flex flex-col w-full">
                            <p class="text-brand-dark-gray dark:text-gray-300 text-base font-medium leading-normal pb-2">Mật khẩu</p>
                            <div class="relative flex w-full flex-1 items-stretch rounded-lg">
                                <input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-brand-dark-gray dark:text-white dark:bg-background-dark focus:outline-0 focus:ring-2 focus:ring-brand-light-beige border border-brand-light-gray bg-white focus:border-brand-light-beige h-14 placeholder:text-gray-400 p-[15px] text-base font-normal leading-normal" placeholder="Nhập mật khẩu" type="password" value=""/>
                                <button class="absolute inset-y-0 right-0 flex items-center pr-4 text-gray-500 hover:text-brand-dark-gray dark:hover:text-white">
                                    <span class="material-symbols-outlined" data-icon="Eye" data-size="24px" data-weight="regular">visibility</span>
                                </button>
                            </div>
                        </label>
                        <div class="flex justify-between items-center">
                            <label class="flex gap-x-3 items-center cursor-pointer">
                                <input class="form-checkbox h-5 w-5 rounded border-brand-light-gray border-2 bg-transparent text-brand-deep-black checked:bg-brand-deep-black checked:border-brand-deep-black focus:ring-2 focus:ring-offset-2 focus:ring-offset-brand-off-white dark:focus:ring-offset-background-dark focus:ring-brand-light-beige focus:outline-none" type="checkbox"/>
                                <p class="text-brand-dark-gray dark:text-gray-300 text-base font-normal leading-normal">Ghi nhớ đăng nhập</p>
                            </label>
                            <a class="text-sm font-medium text-brand-dark-gray dark:text-gray-300 hover:text-brand-deep-black dark:hover:text-white" href="#">Quên mật khẩu?</a>
                        </div>
                        <button class="flex items-center justify-center w-full h-14 px-6 py-3 rounded-lg bg-brand-deep-black text-white text-base font-bold uppercase tracking-wider hover:bg-opacity-90 transition-colors">
                            ĐĂNG NHẬP
                        </button>
                        <button class="flex items-center justify-center w-full h-14 px-6 py-3 rounded-lg bg-white dark:bg-gray-800 text-brand-dark-gray dark:text-white text-base font-medium border border-brand-light-gray hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
                            <img alt="Google logo" class="w-6 h-6 mr-3" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAsPxIsK6O4aFVnJErZKmC0savAjmvvZW3AXC_hOTIWlU_RacOBVDSdltaEVJPSi50hoLbD30aezPR9xOoQkO10ECK0dhHL6bi1Y_fR_FgULlp3bHdnnRRPsslNliYZTHvU8IoRHDUyJrS_nwYV1iK1co179CqNCNilbiMrjchOfsIVVBndBKPLZ5inQXQMXBOKMzla08A367oU2THt1uTshBpLqo0fccbITS-BRYJg5dUEgZ-vLGDbCfWmKZMhhc0VdbntLhmnnhM"/>
                            Đăng nhập bằng Google
                        </button>
                        <div class="text-center">
                            <p class="text-brand-dark-gray dark:text-gray-300 text-base font-normal">Bạn chưa có tài khoản? <a class="font-bold hover:text-brand-deep-black dark:hover:text-white" href="#">Đăng ký ngay!</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body></html>
